<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ЕГЭ English Trainer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c1f24;--mut:#6a7280;--line:#dde1e7;--acc:#1f5eff;--accs:#e8efff;--ok:#1a7f45;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2128;--ink:#eceff4;--mut:#9aa3b2;--line:#2c323c;--acc:#7aa2ff;--accs:#202a44;--ok:#4cc38a;--bad:#ff7b6b}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2128;--ink:#eceff4;--mut:#9aa3b2;--line:#2c323c;--acc:#7aa2ff;--accs:#202a44;--ok:#4cc38a;--bad:#ff7b6b}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
header{padding:20px 20px 0;max-width:1100px;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-.3px}.sub{color:var(--mut);margin:0 0 14px}
.tabs,.subnav{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.subnav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.subnav{margin:14px 0}.subnav button.on{background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:0 20px 60px}
.panel,.sp{display:none}.panel.on,.sp.on{display:block}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{font:inherit;background:var(--acc);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.s{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}
.bh{margin:28px 0 8px;font-size:20px;border-bottom:2px solid var(--acc);padding-bottom:4px}
.vs,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0}
.vs h3{margin:0 0 6px;font-size:16px}
ul{list-style:none;margin:0;padding:0;columns:2 340px;column-gap:28px}
li{padding:3px 0;break-inside:avoid;font-size:15px}li.lab{font-weight:700;font-style:italic;color:var(--acc);column-span:all;margin-top:6px}
.say{font-size:10px;border:1px solid var(--line);background:var(--accs);color:var(--acc);border-radius:50%;width:22px;height:22px;cursor:pointer;margin-right:7px;vertical-align:middle}
.en{font-weight:700}.ru{color:var(--mut)}.ex{display:block;font-style:italic;margin:0 0 2px 29px;font-size:14px}
body.hr .ru{display:none}
table{border-collapse:collapse;width:100%;font-size:14px}td{border:1px solid var(--line);padding:5px 8px}
.fam ul{columns:auto}
.task{font-size:15px}.instr{background:var(--accs);border-left:4px solid var(--acc);padding:10px 14px;border-radius:6px;margin:8px 0 14px}
.row{display:flex;gap:12px;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px dotted var(--line)}
.row .w{font-weight:700;letter-spacing:.5px;white-space:nowrap}
input.g{font:inherit;width:150px;border:0;border-bottom:2px solid var(--acc);background:transparent;color:var(--ink);text-align:center;padding:0 2px}
input.g.ok{border-color:var(--ok);color:var(--ok)}input.g.no{border-color:var(--bad);color:var(--bad)}
.n{font-weight:700}textarea{width:100%;min-height:230px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cnt{color:var(--mut);font-size:14px}.cnt.good{color:var(--ok);font-weight:700}.cnt.bad{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:3px 9px;border-radius:14px;cursor:pointer}
.letter{background:var(--card);border:1px solid var(--line);padding:14px 18px;border-radius:8px;white-space:pre-line}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar i{display:block;height:20px;background:var(--acc);border-radius:3px}
.tm{font-weight:700;color:var(--acc);margin-left:8px}
.logo{height:34px;display:block;margin:0 0 10px;opacity:.9;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}}
:root[data-theme="dark"] .logo{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
.gate{text-align:center;padding:40px 10px}.gate input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin:10px 4px}.err{color:var(--bad)}
.exam{border:1px solid var(--ink);padding:12px 16px;border-radius:4px}.exam td{border-color:var(--ink)}.plan{padding-left:4px}.pie{max-width:100%;width:520px;display:block;margin:8px auto;background:#fff;border-radius:4px}.tape{padding:6px 0;border-bottom:1px dotted var(--line)}
.mail{background:var(--bg);border:1px solid var(--line);padding:6px 10px;margin:6px 0;font-size:14px}.msg{white-space:pre-line;margin:6px 0 10px}
.q{padding:6px 0;border-bottom:1px dotted var(--line)}.q.okq{background:rgba(26,127,69,.12)}.q.noq{background:rgba(192,57,43,.12)}.q select{font:inherit;max-width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px}.opt{margin-right:12px;white-space:nowrap}.sc{margin-left:8px;font-weight:700}
.ins{border:1px solid var(--ink);background:none;font-style:italic;font-weight:700;border-radius:2px}.ct{text-align:center;margin:4px 0 8px}.wrow{display:grid;grid-template-columns:42px 1fr 140px;gap:14px;align-items:end;padding:12px 0}.nb{border:1px solid var(--ink);text-align:center;font-weight:700;padding:3px 0;align-self:start}.ww{font-weight:700;letter-spacing:.5px;text-align:center}.wt{line-height:1.9}@media (max-width:640px){.wrow{grid-template-columns:34px 1fr}.ww{grid-column:2;text-align:left}}
.ma{margin-top:8px}.ma summary{cursor:pointer;color:var(--acc);font-weight:700}.ma p{margin:6px 0}.ma b{color:var(--acc)}
@media print{@page{margin:12mm}header,.toolbar,.say,.subnav,.practice{display:none!important}body{background:#fff;color:#000;font-size:10pt}
.panel:not(.on),.sp:not(.on){display:none!important}.vs{border:0;padding:0 0 4px;margin:4px 0;background:none}.vs h3{background:#eee;padding:2px 6px}.bh{margin-top:14px;border-color:#000}ul{columns:2}li{font-size:9.5pt}.ex{font-size:9pt}.ru{color:#333}}
</style></head><body>

 habitats.</span></li><li><button class="say" data-t="deal with. Governments must deal with the problem of waste." aria-label="Listen">&#9654;</button><span class="en">deal with</span><span class="ru"> — справляться, иметь дело</span><span class="ex">Governments must deal with the problem of waste.</span></li><li><button class="say" data-t="come up with. Engineers came up with a way to turn plastic into fuel." aria-label="Listen">&#9654;</button><span class="en">come up with</span><span class="ru"> — придумать</span><span class="ex">Engineers came up with a way to turn plastic into fuel.</span></li><li><button class="say" data-t="hold back. Lack of money holds back many green projects." aria-label="Listen">&#9654;</button><span class="en">hold back</span><span class="ru"> — сдерживать</span><span class="ex">Lack of money holds back many green projects.</span></li><li><button class="say" data-t="speed up, slow down. We need to slow down climate change." aria-label="Listen">&#9654;</button><span class="en">speed up / slow down</span><span class="ru"> — ускорять / замедлять</span><span class="ex">We need to slow down climate change.</span></li><li><button class="say" data-t="build up. Greenhouse gases build up in the atmosphere." aria-label="Listen">&#9654;</button><span class="en">build up</span><span class="ru"> — накапливаться</span><span class="ex">Greenhouse gases build up in the atmosphere.</span></li><li><button class="say" data-t="wear out. Reusable bags wear out less quickly than paper ones." aria-label="Listen">&#9654;</button><span class="en">wear out</span><span class="ru"> — изнашивать(ся)</span><span class="ex">Reusable bags wear out less quickly than paper ones.</span></li><li><button class="say" data-t="sort out. We sort out our rubbish into four bins." aria-label="Listen">&#9654;</button><span class="en">sort out</span><span class="ru"> — разбираться, сортировать</span><span class="ex">We sort out our rubbish into four bins.</span></li><li><button clas var SPK2=[{"title": "Task 10736 (IT)", "intro": "Hello everybody! It’s Teenagers Round the World Channel. Our guest today is a teenager from Russia and we are going to discuss IT. We’d like to know our guest’s point of view on this issue. Please answer five questions. So, let’s get started.", "q": [["How has technology affected education in recent years?", ["e-learning", "distance learning", "online courses", "access to information", "educational apps"]], ["Do you think online classes will replace in-person ones?", ["in-person classes", "distance learning", "face-to-face communication", "flexible", "lack of discipline"]], ["Should schools put more emphasis on teaching children IT?", ["digital skills", "programming", "IT lessons", "keep up with technology", "future jobs"]], ["What person would you consider the best in the field of IT?", ["inventor", "innovation", "breakthrough", "cutting-edge technology", "make life easier"]], ["Do you have any friends who plan to work in IT?", ["IT specialist", "software developer", "career prospects", "plan to", "well-paid job"]]], "end": "Thank you very much for your interview."}];var LET2=[{"id": "15247", "name": "Mark", "intro": "You have received an email message from your English-speaking pen-friend Mark:", "from": "Mark@mail.us", "to": "Russian_friend@ege.ru", "subj": "Screen time", "msg": "... I've been trying to limit my screen time recently. I've noticed if I'm not strict with myself, I can scroll through social media forever. So, I've started leaving my phone in my bathroom before I go to bed. I can still hear the alarm, but I cannot scroll in bed! How much time a day do you waste scrolling through social media? What do you do to limit your screen time? What do your parents say when you use your phone too much?\nBy the way, my sister has finally got a job in a bookstore! ...", "instr": ["Write a letter to Mark.", "In your message:", "— answer her questions;", "— ask 3 questions about his sister's new job.", "Write 100–140 words. Remember the rules of email writing."]}];var ESS2=[{"id": "38.1", "intro": "Imagine that you are doing a project on how much time young Zetlanders spend on social media. You have found some data on the subject — the results of a survey conducted among teenagers in Zetland (see the table below). Comment on the survey data and give your opinion on the subject of the project.", "q": "How much time do you spend on social media every day?", "plan": ["make an opening statement on the subject of the project;", "select and report 2–3 facts;", "make 1–2 comparisons where relevant and give your comments;", "outline a problem that can arise with spending too much time on social media and suggest a way of solving it;", "conclude by giving and explaining your opinion on the role of social media in teenagers' lives."], "kind": "table", "head": ["Options", "Number of respondents (%)"], "rows": [["More than 4 hours", 38], ["2–4 hours", 27], ["1–2 hours", 19], ["Less than 1 hour", 11], ["I don't use social media", 5]]}, {"id": "38.2", "intro": "Imagine that you are doing a project on where young Zetlanders get their news from. You have found some data on the subject — the results of a survey conducted among young Zetlanders (see the pie chart below). Comment on the survey data and give your opinion on the subject of the project.", "q": "Where do you usually get the news from?", "plan": ["make an opening statement on the subject of the project;", "select and report 2–3 facts;", "make 1–2 comparisons where relevant and give your comments;", "outline a problem that can arise with relying on social media for news and suggest a way of solving it;", "conclude by giving and explaining your opinion on the reliability of information found online."], "kind": "pie", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA64AAAH5CAYAAACBEmMUAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAaJQAAGiUBh+i34AABAABJREFUeJzs3XdYU+fbB/Bv2 var WF3=[{t:"Sleep and teenagers",s:[["Sleep is not a luxury but a biological",25,"NECESSARY","necessity"," for every human being. Yet millions of teenagers regularly go to bed far too late."],["Researchers claim that people who sleep badly have a weaker",26,"RESIST","resistance"," to disease and recover from illnesses more slowly."],["Sleepy students are",27,"EASY","easily"," distracted and find it difficult to memorise new information."],["Experts therefore suggest that starting lessons later could improve pupils’",28,"CONCENTRATE","concentration"," and academic results."],["Switching off electronic",29,"DEVICE","devices"," an hour before bedtime is another simple but effective piece of advice."]]},
{t:"Why exercise matters",s:[["Regular physical",25,"ACTIVE","activity"," is one of the most reliable ways of staying healthy, whatever your age."],["It strengthens the heart, lowers blood pressure and reduces the risk of",26,"DANGER","dangerous"," diseases such as diabetes."],["Exercise also has a",27,"POWER","powerful"," effect on mood, because it helps the body to release hormones that reduce stress."],["That is why doctors advise even those who do not consider themselves",28,"ENERGY","energetic"," to walk for half an hour a day."],["The key is to choose an activity that is",29,"ENJOY","enjoyable",", so that exercise never becomes a burden."]]},
{t:"The Olympic Games",s:[["The ancient Olympic Games, held in Greece more than two thousand years ago, were a religious",25,"CELEBRATE","celebration"," as much as a sporting event."],["The modern Olympics were revived in 1896 thanks to the",26,"INITIATE","initiative"," of the French educator Pierre de Coubertin."],["Today, thousands of",27,"ATHLETE","athletes"," from more than two hundred countries take part in the Games."],["Winning a medal requires years of hard training, great",28,"DETERMINE","determination"," and a little luck."],["Unfortunately, the Games have also been marked by scandals",29,"INVOLVE","involving"," doping, which spoils the spirit of fair play."]]},
{t:"Extreme sports",s:[["Extreme sports such as skydiving or rock climbing attract those who seek strong emotions and",25,"FREE","freedom"," from everyday routine."],["Participants, however, face a high risk of serious",26,"INJURE","injuries"," , some of which can be life-changing."],["Professional instructors insist that proper",27,"PREPARE","preparation"," and the right equipment are essential."],["Beginners often underestimate the danger, which can have",28,"TRAGEDY","tragic"," consequences."],["Those who follow safety rules are far more",29,"LIKE","likely"," to enjoy the adrenaline without risking their lives."]]}];

 have just returned from our school volleyball competition. I played for my class team and we won! What sport competitions are held in your school, if any? How can you become a member of your school sport team? Is it an easy thing to do? What kind of sport sections can you attend at school or in town?\nOh, I have some more good news! My sister had a great birthday party yesterday!...", "instr": ["Write an email to Jane. In your message answer her questions, ask 3 questions about her sister’s birthday party. Write 100–140 words. Remember the rules of email writing. You have 20 minutes to do this task."]}, {"id": "10968", "name": "Tom", "intro": "You have received an email message from your English-speaking pen-friend Tom:", "from": "Friend@mail.uk", "to": "Russian_friend@ege.ru", "subj": "Welcome", "msg": "...Last summer my parents and I went hiking to the mountains. We spent the whole week together and enjoyed it very much. How often do you take active holidays? Who do you think is the best company for you? What extreme sports would you like to try, if any, and why?\nLast month our English class got an unusual project. We wrote a paper about interesting events in the past of our country...", "instr": ["Write an email to Tom. In your message:", "— answer his questions;", "— ask 3 questions about his project paper.", "Write 100–140 words. Remember the rules of email writing. You have 20 minutes to do this task."]}, {"id": "11002", "name": "Frank", "intro": "You have received an email message from your English-speaking pen-friend Frank:", "from": "Friend@mail.uk", "to": "Russian_friend@ege.ru", "subj": "Welcome", "msg": "...Surprisingly, but I became the best student of the week! My parents were very happy when I told them. By the way, where does your physical education classes take place? How do you keep fit? What is your favourite sport game? Why?\nI’ve written an essay on ancient history...", "instr": ["Write an email to Frank.", "In your message:", "— answer his questions;", "— ask 3 questions about an essay on ancient history.", "Write 100–140 words. Remember the rules of email writing."]}, {"id": "11012", "name": "Olivia", "intro": "You have received an email message from your English-speaking pen-friend Olivia:", "from": "Friend@mail.uk", "to": "Russian_friend@ege.ru", "subj": "Welcome", "msg": "...I know it’s often cold in Russia in winter. What do you usually do not to catch a cold? What is a healthy lifestyle for you? How can you catch up with the class if you do fall ill?\nMy cousins have come to stay with us for the weekend...", "instr": ["Write an email to Olivia.", "In your message:", "— answer her questions;", "— ask 3 questions about her cousins.", "Write 100–140 words. Remember the rules of email writing."]}, {"id": "11018", "name": "Linda", "intro": "You have received an email message from your English-speaking pen-friend Linda:", "from": "Friend@mail.uk", "to": "Russian_friend@ege.ru", "subj": "Welcome", "msg": "...I’ve recently joined a yoga group. We meet every Saturday afternoon in the park, and it’s free. The instructor is really patient. I’ve been dreaming of doing headstands for so long and now I can do both headstands and handstands! What do you do to keep fit? What advantages do you see in exercising as a group rather than on your own, if any? Do you believe it is important to have an instructor and why or why not?\nBy the way, my big brother wrote a children’s book and it got published!...", "instr": ["Write an email to Linda.", "In your message:", "— answer his questions;", "— ask 3 questions about the children’s book.", "Write 100–140 words. Remember the rules of email writing."]}, {"id": "11394", "name": "Cindy", "intro": "You have received an email message from your English-speaking pen-friend Cindy:", "from": "Cindy@mail.uk", "to": "Russian_friend@ege.ru", "subj": "Extreme sports", "msg": "... Have I ever told you that my dad’s hobby is parachuting? I find it terrifying! But my elder brother can’t var MODEL={"t1": [["My friends and I try to [[protect the environment]] in small ways. We [[sort rubbish]], use [[reusable bags]] instead of plastic ones and sometimes take part in a [[clean-up campaign]] in our local park. I believe that [[every little helps]].", "Yes, I think it is very important to [[go green]] nowadays. If we don't [[take action]] now, the damage to nature may become irreversible. That is why each of us should [[take responsibility]] for [[future generations]].", "In my region people usually [[recycle]] paper and plastic, and there are special containers for [[waste sorting]] in many yards. Many people also plant trees and take part in volunteer events to clean up forests and rivers. Besides, some shops now charge for plastic bags.", "Schools can [[raise awareness]] through [[environmental education]] lessons and [[eco-projects]]. For example, pupils could organise a recycling contest or collect waste paper. Teachers should also [[set an example]] by saving energy at school.", "I would [[cut down on]] plastic and buy fewer things I don't really need. I would also [[save energy]] by switching off the lights and use public transport or a bike more often. These small changes could really [[make a difference]]."], ["I live in the Moscow region, and the state of ecology here is not perfect. There are many factories and heavy traffic near big towns, so [[air pollution]] is a problem. However, there are also forests and parks where people can rest.", "The main sources of pollution are [[factories]], [[exhaust fumes]] from cars and [[household waste]]. [[Industrial waste]] is often dumped into rivers, which harms [[wildlife]]. Another serious source is plastic, which takes hundreds of years to break down.", "We can reduce [[emissions]] by [[switching to]] [[renewable energy]] such as solar and wind power. People should also use [[public transport]] or electric cars instead of petrol ones. Besides, factories must install filters to clean the air.", "[[Global warming]] causes [[rising temperatures]], [[melting glaciers]] and [[extreme weather]] like floods and droughts. As a result, sea levels rise and some coastal cities may be under water. It also puts many [[species]] at risk of [[extinction]].", "I think both are responsible, but companies bear more responsibility because they produce the largest amount of waste and emissions. At the same time, individuals can [[make a difference]] by choosing [[eco-friendly]] products. Only by working together can we solve this problem."]], "t2": [["[[Technology]] has changed education greatly. Thanks to [[e-learning]] platforms and [[educational apps]], pupils have [[access to information]] at any moment and can study at their own pace. During the pandemic, [[distance learning]] became a part of everyday life.", "I don't think online classes will fully replace [[face-to-face]] ones. Studying online is [[convenient]] and saves time, but pupils often lose concentration and miss live communication with teachers and classmates. In my opinion, a mixed format would be the best option.", "Yes, I think schools should pay more attention to IT. [[Digital skills]] are essential in the modern world, and many future jobs will require [[programming]]. Besides, IT lessons teach pupils to think logically and solve problems.", "I would name Steve Jobs. He was a talented [[inventor]] who created [[innovative]] devices like the iPhone and changed the way we use technology. His [[breakthroughs]] made our lives easier.", "Yes, one of my friends plans to become a [[software developer]]. He is already learning programming and wants to work for a big IT company. It is a well-paid job with great [[career prospects]], so I support his choice."]], "t3": [["I like swimming and playing volleyball. Swimming helps me to [[keep fit]] and [[relieve stress]], and volleyball is a [[team sport]] that teaches me to cooperate. I try to do sport at least three times a week.", "At our PE lessons we mostly play football, basketball and volleyball. Sometimes we also do [[athletics]] and [[gymnastics]] or go skiing in winter. Our teacher always begins with a [[warm-up]] to avoid [[injuries]].", "My favourite lessons were those where we played team games like basketball. They were fun and helped us to make friends and [[learn teamwork]]. I also liked cross-country skiing in winter because we spent time in [[fresh air]].", "To encourage teenagers to [[do sport]] regularly, schools should offer more [[sports clubs]] and sections, and the [[sports equipment]] should be modern. Parents and teachers could also [[set an example]]. In addition, school competitions make sport more exciting.", "I think it is a good idea to give marks for PE, because it motivates pupils to try harder. However, the marks should depend on effort and progress, not only on results. Otherwise, pupils who are less [[athletic]] may lose interest."], ["I [[catch a cold]] once or twice a year, usually in autumn. The last time I [[fell ill]] was in February: I had a [[sore throat]] and a high [[temperature]], so I stayed in bed for a few days and took [[medicine]].", "In my home town there is a big [[clinic]], several [[pharmacies]], a [[hospital]] and a few private medical centres. There is also an [[ambulance]] station. Unfortunately, there is sometimes a long [[waiting list]] to see a specialist.", "I think people are healthier today because of modern [[medicine]], [[vaccination]] and better [[healthcare]]. People also know more about a [[healthy lifestyle]] and [[balanced diet]]. On the other hand, a [[sedentary lifestyle]] and stress cause new problems.", "The most frequent health problems among young people are poor eyesight, bad posture and [[lack of sleep]]. Many teenagers spend too much time on screens and do not do enough exercise. As a result, some of them have problems with [[overweight]] and [[stress]].", "Parents should set a good example by eating healthy food and doing sport. They can also talk to their children about the harm of [[bad habits]] and make sure they get enough sleep. It is important to go for regular [[check-ups]] together."], ["Yes, I think my lifestyle is quite healthy. I go to bed early, [[eat in moderation]] and do sport several times a week. Although I sometimes eat [[fast food]], I try to [[cut down on]] sugar.", "My friends and I enjoy playing football and going [[cycling]] at weekends. Sometimes we also go to the swimming pool or [[go hiking]]. It is a great way to [[stay in shape]] and spend time together.", "Young people in my country like pizza, burgers and [[fast food]] in general because it is cheap and tasty. Of course, it is not healthy, as it contains a lot of fat and sugar. Fortunately, more teenagers now choose fresh [[fruit and vegetables]].", "Schools can support a [[healthy lifestyle]] by serving [[nutritious]] meals in the canteen and organising more sports events. They could also invite doctors to talk about [[bad habits]] and [[balanced diet]]. It is also important to have enough PE lessons.", "I would [[get enough sleep]] and stop staying up late playing computer games. I would also [[cut down on]] sweets and drink more water to [[stay hydrated]]. These small changes would help me to feel more [[energetic]]."], ["I live in the Moscow region, where there are several famous teams. For example, football and hockey clubs are very popular here, and many people go to [[stadiums]] to support them. Our region also has good sports facilities.", "My region is famous for its old towns and beautiful nature. People like to [[go hiking]] in the forests and ski in winter. It is also a good place for fishing and rest at the weekend.", "In Russia, football, [[ice hockey]] and [[figure skating]] are very popular. Tennis and [[gymnastics]] are also well known. On the other hand, baseball and cricket aren't popular because few people know the rules.", "My favourite sport is basketball. It is fast and exciting, and it develops [[teamwork]] and [[coordination]]. Besides, I can play it all year round in the [[sports hall]].", "Yes, most of my friends are interested in sports. Some of them play football and others do [[martial arts]] or go to the gym. We often [[work out]] together and watch matches on TV."], ["[[Extreme sports]] are exciting but dangerous. The main risks are serious [[injuries]] such as fractures and head trauma, and sometimes even death. That is why it is vital to wear [[helmets]] and follow safety rules.", "In Russia, [[snowboarding]], skydiving, [[climbing]] and [[parkour]] are quite popular among young people. On the other hand, surfing and bungee jumping aren't widely practised because of the climate and lack of facilities.", "If I had to choose, I would try rock [[climbing]], because it develops strength and [[stamina]] and gives you fantastic views. I would only do it with a professional instructor. Safety is the most important thing for me.", "Extreme sports teach people to overcome fears and to rely on themselves. They also develop [[willpower]], [[endurance]] and concentration. In addition, they give a lot of positive emotions and the feeling of freedom.", "Yes, I am a bit interested in them, especially in snowboarding. I like speed and the feeling of adrenaline, and I would like to [[take part in]] a competition one day. However, I always remember about safety."], ["I live in the Moscow region. I think it is quite a healthy place to live in because there are many forests and parks. However, in big towns near Moscow [[air pollution]] and heavy traffic can be a problem.", "Sport plays an important role in staying healthy. Regular exercise [[strengthens the heart]] and muscles, [[boosts the immune system]] and helps to [[relieve stress]]. People who do sport feel more energetic and sleep better.", "I believe a [[balanced diet]] is good for the body. It should include plenty of [[fruit and vegetables]], proteins and whole grain products, and less sugar and [[fast food]]. It is also important to drink enough water.", "I would describe my lifestyle as active and quite healthy. I walk to school, go to the gym twice a week and try to [[get enough sleep]]. The only problem is that I spend too much time on my phone.", "Yes, my family is quite active. My parents go jogging in the mornings, and my brother plays football. At weekends we often go [[cycling]] or [[go hiking]] together, and it helps us to [[keep fit]] and feel better."], ["Yes, I have caught a cold several times. The last time I fell ill was a month ago: I had a runny nose, a cough and a [[fever]]. I stayed in bed for three days and drank hot tea with lemon.", "I try to avoid [[bad habits]], but sometimes I stay up late and eat [[junk food]]. I know that lack of sleep and unhealthy snacks can [[harm my health]]. I'm going to [[cut down on]] them.", "I think the most frequent problems are poor posture, short-sightedness and [[stress]]. Young people sit for hours at their desks and in front of screens, so they have back pain and tired eyes. Many also suffer from [[overweight]] because of a [[sedentary lifestyle]].", "To take care of my health I [[go to bed early]], eat fruit and vegetables and do sport twice a week. I also try to spend more time outdoors and [[avoid stress]]. Once a year I go for a [[check-up]].", "I think fitness trackers and smartwatches can help people to monitor their pulse and [[count calories]]. [[Telemedicine]] will also make medical advice available to everyone, even in remote villages. In addition, new medical research and [[breakthroughs]] will help to cure many diseases."]]};
function ma(tid,k,j){var A=MODEL[tid]&&MODEL[tid][k]&&MODEL[tid][k][j];if(!A)return "";return '<details class="ma"><summary>Model answer</summary><p>'+esc(A).replace(/\[\[(.+?)\]\]/g,"<b>$1</b>")+'</p><button class="chip say-c" data-t="'+esc(A.replace(/\[\[|\]\]/g,""))+'">&#9654; Listen</button></details>'}

function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sel(o){return '<select><option value=""></option>'+o.map(function(x){return '<option>'+esc(x)+'</option>'}).join("")+'</select>'}
function qrow(n,a,html){return '<div class="q" data-a="'+esc(a)+'"><span class="n">'+(n+1)+'.</span> '+html+'</div>'}
function gen(k,tid){var VDT=VD[tid];var h="",it=[];
if(k=="pv"){VDT.pv.forEach(function(x){var b=x[0].split(" / ")[0].replace(/\s*\(.*?\)/g,"").replace(/\b(sth|sb)\b/g,"").trim().toLowerCase(),ex=x[1].split(" / ")[0],m=ex.toLowerCase().indexOf(b);if(b&&m>=0)it.push({s:ex.slice(0,m)+"_______"+ex.slice(m+b.length),a:b})});var all=it.map(function(x){return x.a});sh(it).slice(0,8).forEach(function(x,n){h+=qrow(n,x.a,esc(x.s)+" "+sel(sh([x.a].concat(sh(all.filter(function(y){return y!=x.a})).slice(0,3)))))})}
else if(k=="wp"){VDT.wp.forEach(function(x){var base=x[0].split(" / ")[0].replace(/\(.*?\)/g,"").trim(),ws=base.split(/\s+/).filter(function(w){return w&&w!="sth"&&w!="sb"&&w!="+"&&w!="-ing"}),p=ws[ws.length-1],kw=ws[ws.length-2];if(ws.length>1&&PR.indexOf(p)>=0&&/^[a-z-]+$/i.test(kw)){var ex=(x[1]||"").split(" / ")[0],r=new RegExp("\\b("+kw.slice(0,Math.max(3,kw.length-2))+"\\w*)\\s+"+p+"\\b","i"),m=ex&&r.exec(ex);it.push(m?{s:esc(ex.replace(r,m[1]+" _____")),a:p,x0:x[0]}:{s:esc(base.replace(new RegExp("\\b"+p+"\\b(?!.*\\b"+p+"\\b)"),"_____"))+' <span class="ru">('+esc(x[2]||"")+')</span>',a:p,x0:x[0]})}});sh(it).slice(0,8).forEach(function(x,n){h+=qrow(n,x.a,x.s+" "+sel(sh([x.a].concat(sh(PR.filter(function(y){return y!=x.a&&(" "+x.x0.replace(/\//g," ")+" ").indexOf(" "+y+" ")<0})).slice(0,3)))))})}
else if(k=="mt"){var w=VDT.w.filter(function(x){return x[0].length<=30&&x[0].indexOf(" / ")<0&&x[1].length<=45&&x[1].indexOf("/")<0}),pk=sh(w).slice(0,8),tr=sh(pk.map(function(x){return x[1]}));pk.forEach(function(x,n){h+=qrow(n,x[1],"<b>"+esc(x[0])+"</b> "+sel(tr))})}
else if(k=="dc"){var d=VDT.w.filter(function(x){return /^[a-z][a-z' -]{3,24}$/i.test(x[0])&&!/\b(sth|sb)\b/.test(x[0])});sh(d).slice(0,8).forEach(function(x,n){h+=qrow(n,x[0],'<button class="chip say-c" data-t="'+esc(x[0])+'">&#9654; Listen</button> <input class="g" autocomplete="off" spellcheck="false">')})}

function tcheck(c){var ok=0,tot=0;c.querySelectorAll(".q").forEach(function(q){tot++;var v="",s=q.querySelector("select"),r=q.querySelector("input[type=radio]:checked"),i=q.querySelector("input.g");if(s)v=s.value;else if(r)v=r.value;else if(i)v=i.value.trim();var good=v&&v.toLowerCase()==q.dataset.a.toLowerCase();if(good)ok++;q.className="q "+(good?"okq":v?"noq":"")});c.querySelector(".sc").textContent="Score: "+ok+" / "+tot}

function build(T){

var e='<div class="task"><div class="instr"><b>Task 38.</b> Choose one task (38.1 or 38.2) and write the essay.</div>';ESS[T.id].forEach(function(x){e+='<div class="card"><div class="exam"><p><b>['+x.id+']</b> '+esc(x.intro)+' <b>The survey question: <i>'+esc(x.q)+'</i> (Choose one option)</b></p>';

e+='<p><b>Write 200–250 words. Use the following plan:</b></p><ul class="plan">'+x.plan.map(function(z){return '<li>– '+esc(z)+'</li>'}).join("")+'</ul></div><div class="cnt">Words to use:</div>'+chips(ESSCH[T.id])+'<textarea data-e="1"></textarea><div class="cnt"></div></div>'});

subs.forEach(function(s,i){var b=document.createElement("button");b.textContent=s[1];b.dataset.s=s[0];if(!i)b.className="on";nav.appendChild(b);var d=el('<div class="sp'+(i?' practice':'')+(i?'':' on')+'" data-s="'+s[0]+'"></div>');d.innerHTML=body[s[0]];p.appendChild(d)});
$(".sp[data-s=wf]",p).classList.add("practice");
